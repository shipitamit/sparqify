name: "Sparqify: convert code to Apache Spark"
description: "Convert pandas, SQL, SAS, R, Informatica, stored procedures, streaming code and more to Apache Spark, report TODOs on the pull request."
author: "sparqify"
branding:
  icon: zap
  color: orange

inputs:
  path:
    description: "Folder to convert (relative to the repository root)."
    default: "."
  output:
    description: "Folder for the converted files and the report."
    default: "sparqify-out"
  changed-only:
    description: "On pull requests, convert only the files changed in the PR."
    default: "true"
  dialect:
    description: "Source SQL dialect (generic, tsql, oracle, mysql, postgres, snowflake, bigquery, redshift, duckdb, hive, trino, presto, sqlite, teradata, spark, databricks)."
    default: "generic"
  sql-out:
    description: "SQL output style: pyspark (spark.sql calls) or sql (plain Spark SQL)."
    default: "pyspark"
  target:
    description: "spark, databricks (notebook source files), or a native engine: gluten, comet, fabric, photon (settings and fallback warnings)."
    default: "spark"
  mode:
    description: "dataframe (PySpark DataFrames) or pandas-api (pyspark.pandas) for pandas code."
    default: "dataframe"
  optimize:
    description: "Run the performance pass (UDF -> built-ins, broadcast joins, cache)."
    default: "false"
  delta:
    description: "Write Delta tables / DDL USING DELTA."
    default: "false"
  catalog:
    description: "Unity Catalog name: qualify tables as catalog.schema.table."
    default: ""
  schema:
    description: "Schema for unqualified table names (with catalog)."
    default: "default"
  broadcast:
    description: "Comma-separated DataFrame names to broadcast in joins (with optimize)."
    default: ""
  ai:
    description: "Ask a language model for suggestions on TODO blocks (sends those snippets to the provider you choose; needs ai-api-key unless the provider is local)."
    default: "false"
  ai-provider:
    description: "anthropic, openai, gemini, mistral, groq, together, openrouter, ollama or custom (any OpenAI-compatible server). Empty: guessed from the key."
    default: ""
  ai-model:
    description: "Model id. Anthropic has a default; other providers need one."
    default: ""
  ai-base-url:
    description: "API base URL (https, or http for localhost). Needed for provider custom."
    default: ""
  ai-api-key:
    description: "API key for ai (pass it from a repository secret)."
    default: ""
  anthropic-api-key:
    description: "Deprecated alias of ai-api-key for the anthropic provider."
    default: ""
  comment:
    description: "Post or update a summary comment on the pull request."
    default: "true"
  upload-artifact:
    description: "Upload the converted files and report as a workflow artifact."
    default: "true"
  fail-on:
    description: "Fail the job when: none | todo (any TODO remains) | failed (a file crashed the converter)."
    default: "none"
  python-version:
    description: "Python version used to run sparqify."
    default: "3.12"
  github-token:
    description: "Token used to post the comment (needs pull-requests: write)."
    default: ${{ github.token }}

outputs:
  converted:
    description: "Number of files converted."
    value: ${{ steps.summary.outputs.converted }}
  needs-review:
    description: "Number of files with TODOs."
    value: ${{ steps.summary.outputs.needs_review }}
  failed:
    description: "Number of files that failed."
    value: ${{ steps.summary.outputs.failed }}
  todos:
    description: "Total TODO count."
    value: ${{ steps.summary.outputs.todos }}
  warnings:
    description: "Total warning count."
    value: ${{ steps.summary.outputs.warnings }}
  report-path:
    description: "Path of the Markdown report."
    value: ${{ steps.summary.outputs.report_path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install sparqify
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"

    - name: List changed files (pull requests)
      id: changed
      if: ${{ inputs.changed-only == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" || true
        git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/sparqify-changed.txt"
        n=$(python -m sparqify ci-changed --path "$INPUT_PATH" --list "$RUNNER_TEMP/sparqify-changed.txt" --out "$RUNNER_TEMP/sparqify-only.txt")
        echo "only=$RUNNER_TEMP/sparqify-only.txt" >> "$GITHUB_OUTPUT"
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "$n changed file(s) under $INPUT_PATH"

    - name: Convert
      id: convert
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_DIALECT: ${{ inputs.dialect }}
        INPUT_SQL_OUT: ${{ inputs.sql-out }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OPTIMIZE: ${{ inputs.optimize }}
        INPUT_DELTA: ${{ inputs.delta }}
        INPUT_CATALOG: ${{ inputs.catalog }}
        INPUT_SCHEMA: ${{ inputs.schema }}
        INPUT_BROADCAST: ${{ inputs.broadcast }}
        ONLY_FILE: ${{ steps.changed.outputs.only }}
        INPUT_AI: ${{ inputs.ai }}
        SPARQIFY_AI_API_KEY: ${{ inputs.ai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        SPARQIFY_AI_PROVIDER: ${{ inputs.ai-provider }}
        SPARQIFY_AI_MODEL: ${{ inputs.ai-model }}
        SPARQIFY_AI_BASE_URL: ${{ inputs.ai-base-url }}
      run: |
        set -uo pipefail
        args=(project "$INPUT_PATH" -o "$INPUT_OUTPUT" --dialect "$INPUT_DIALECT" --sql-out "$INPUT_SQL_OUT" --target "$INPUT_TARGET" --mode "$INPUT_MODE")
        [ "$INPUT_OPTIMIZE" = "true" ] && args+=(--optimize)
        [ "$INPUT_DELTA" = "true" ] && args+=(--delta)
        [ -n "$INPUT_CATALOG" ] && args+=(--catalog "$INPUT_CATALOG" --schema "$INPUT_SCHEMA")
        [ -n "$INPUT_BROADCAST" ] && args+=(--broadcast "$INPUT_BROADCAST")
        [ -n "${ONLY_FILE:-}" ] && args+=(--only "$ONLY_FILE")
        [ "$INPUT_AI" = "true" ] && args+=(--ai)
        python -m sparqify "${args[@]}"

    - name: Summarise
      id: summary
      shell: bash
      env:
        INPUT_OUTPUT: ${{ inputs.output }}
      run: python -m sparqify ci-comment "$INPUT_OUTPUT"

    - name: Upload converted files
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sparqify-output
        path: ${{ inputs.output }}
        if-no-files-found: ignore

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMENT_PATH: ${{ steps.summary.outputs.comment_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
          const marker = '<!-- sparqify-report -->';
          const {owner, repo} = context.repo;
          const issue_number = context.payload.pull_request.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
          } catch (e) {
            core.warning('Could not post the sparqify comment (forked PR or missing pull-requests: write permission): ' + e.message);
          }

    - name: Apply fail-on policy
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        TODOS: ${{ steps.summary.outputs.todos }}
        FAILED: ${{ steps.summary.outputs.failed }}
      run: |
        case "$FAIL_ON" in
          todo)   if [ "${TODOS:-0}" -gt 0 ] || [ "${FAILED:-0}" -gt 0 ]; then echo "::error::sparqify left ${TODOS} TODO(s) and ${FAILED} failed file(s)"; exit 1; fi ;;
          failed) if [ "${FAILED:-0}" -gt 0 ]; then echo "::error::sparqify failed on ${FAILED} file(s)"; exit 1; fi ;;
          none|"") ;;
          *) echo "::error::unknown fail-on value: $FAIL_ON"; exit 1 ;;
        esac
