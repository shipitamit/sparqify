name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest is now 26.04, which has no Python 3.9 build for setup-python; 24.04 does
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest .
      - run: python -m pytest -q

  spark-e2e:
    # runs every case in tests/e2e/cases through the original tool AND the converted PySpark code on real Spark and diffs the results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - run: Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - run: python -m pip install pytest . pandas pyspark==3.5.* duckdb polars dask[dataframe] pyarrow
      - run: python -m pytest -q tests/test_e2e_spark.py tests/test_e2e_etl.py -rs

  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the action on the bundled examples
        id: sparqify
        uses: ./
        with:
          path: examples
          output: sparqify-out
          comment: "false"
          changed-only: "false"
          fail-on: failed
      - name: Check outputs
        run: |
          test "${{ steps.sparqify.outputs.converted }}" -gt 10
          test -f sparqify-out/SPARQIFY_REPORT.md
