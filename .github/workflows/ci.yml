name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest is now 26.04, which has no Python 3.9 build for setup-python; 24.04 does
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest .
      - run: python -m pytest -q

  spark-e2e:
    # runs every case in tests/e2e/cases through the original tool AND the converted PySpark code on real Spark and diffs the results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - run: python -m pip install pytest . pandas pyspark==3.5.* duckdb polars dask[dataframe] pyarrow
      - run: python -m pytest -q tests/test_e2e_spark.py -rs

  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run the action on the bundled examples
        id: sparqix
        uses: ./
        with:
          path: examples
          output: sparqix-out
          comment: "false"
          changed-only: "false"
          fail-on: failed
      - name: Check outputs
        run: |
          test "${{ steps.sparqix.outputs.converted }}" -gt 10
          test -f sparqix-out/SPARQIX_REPORT.md
