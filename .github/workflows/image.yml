name: image
on:
  pull_request:          # plain pull_request only: fork code must not run with write tokens
    paths: [Dockerfile, sparqify/**, deploy/**, pyproject.toml, .github/workflows/image.yml]
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Run scripts/pin_actions.sh once to replace these version tags with full commit SHAs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Build image (not pushed)
        run: docker build -t sparqify:ci .
      - name: Scan image (fails on HIGH/CRITICAL with a fix available)
        # the findings table is printed in THIS step's log, so a failure explains itself
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparqify:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-version-check: true
      - name: Write the scan report (never fails; kept as an artifact)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparqify:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
          format: sarif
          output: trivy.sarif
          skip-version-check: true
      - name: Keep the scan report as a build artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: {name: trivy-sarif, path: trivy.sarif, if-no-files-found: ignore}
      - name: Image runs as non-root and serves probes
        run: |
          test "$(docker run --rm --entrypoint id sparqify:ci -u)" = "10001"
          docker run -d --name sparqify-ci -e SPARQIFY_TOKEN=ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 8765:8765 sparqify:ci
          for i in $(seq 20); do curl -fs localhost:8765/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/api/examples); test "$code" = 401
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/deployment.yaml deploy/k8s/service.yaml deploy/k8s/networkpolicy.yaml deploy/k8s/pdb.yaml deploy/k8s/hpa.yaml deploy/k8s/namespace.yaml deploy/k8s/serviceaccount.yaml deploy/k8s/networkpolicy-ai-egress.example.yaml

  publish:
    if: github.ref_type == 'tag'
    needs: build-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write           # keyless signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Image name and tags (both v0.1.0 and 0.1.0, because the Kubernetes manifests use the tag without the v)
        id: meta
        env:
          REF: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$repo"
            echo "tags<<EOT"
            echo "$repo:$REF"
            echo "$repo:${REF#v}"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image by digest
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
