name: publish
# Publishes to PyPI when a GitHub release is published (tag v<version> must match pyproject.toml).
# Run it by hand (Actions -> publish -> Run workflow) to do a dry run on TestPyPI first.
# Uses PyPI "trusted publishing": no token or password is stored in this repo.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Version in pyproject.toml must match the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version v$v"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with: {name: dist, path: dist/}

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write            # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: "https://test.pypi.org/legacy/"
          skip-existing: true        # a re-run of the same version is not an error

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write            # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
