# Copy to .github/workflows/sparqify.yml in your repository.
# Converts the files changed in each pull request and posts / updates one summary comment.
name: sparqify
on:
  pull_request:
    paths: ["**.py", "**.sql", "**.ipynb", "**.R", "**.sas", "**.scala", "**.java", "**.xml", "**.json", "**.dtsx"]

permissions:
  contents: read
  pull-requests: write      # needed for the comment (not available on PRs from forks: the action only warns)

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YOUR-ORG/sparqify@v1          # this repository, tagged
        with:
          path: etl                          # folder to convert
          dialect: tsql                      # source SQL dialect
          target: databricks                 # or spark
          optimize: "true"
          delta: "true"
          catalog: main
          schema: etl
          fail-on: failed                    # none | todo | failed
