apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparqix
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - hpa.yaml
# Not included on purpose: secret.example.yaml (create the Secret yourself) and ingress.example.yaml (edit the host first).
images:
  - name: ghcr.io/YOUR-ORG/sparqix
    newTag: "0.1.0"
