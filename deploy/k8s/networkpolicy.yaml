# Default-deny, then allow only: ingress to port 8765 from the ingress controller namespace, and egress to DNS. Nothing else leaves the pod.
# The AI suggestions feature needs outbound HTTPS: apply networkpolicy-ai-egress.example.yaml in addition (policies add up).
# The ingress rule assumes ingress-nginx: change the namespace label below for another controller (Traefik, HAProxy, a cloud load balancer, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sparqix
  namespace: sparqix
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sparqix}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8765}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
