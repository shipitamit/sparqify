# Example: terminate TLS at the ingress. Plain HTTP must never be exposed outside the cluster (the token travels in a header).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sparqify
  namespace: sparqify
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
    # nginx stops waiting after 60 s by default; the AI assistant endpoint may take up to 150 s
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    # Per-client rate limits (the app's own failed-token throttle cannot tell clients apart behind a proxy)
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sparqify.example.com]
      secretName: sparqify-tls
  rules:
    - host: sparqify.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: sparqify, port: {name: http}}}}
